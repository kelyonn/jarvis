[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "jarvis-core"
version = "0.1.0"
description = "Jarvis: a personal always-on voice assistant for macOS (NVIDIA NIM brain)."
readme = "README.md"
requires-python = ">=3.10,<3.14"
dependencies = [
    "httpx>=0.27",
    "websockets>=13",
    "pydantic>=2.6",
    "tomli>=2.0; python_version < '3.11'",
    "tomli-w>=1.0",
    "rapidfuzz>=3.6",
    "dateparser>=1.2",
    "psutil>=5.9",
    "feedparser>=6.0",
    "watchfiles>=0.21",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "ddgs>=9",
]

[project.optional-dependencies]
# Local speech stack (Apple Silicon). Installed by scripts/install.sh.
voice = [
    "openwakeword>=0.6",
    "silero-vad>=5.1",
    "mlx-whisper>=0.4; sys_platform == 'darwin'",
    "kokoro>=0.9",
    "soundfile>=0.12",
    "sounddevice>=0.5",
]
markets = ["yfinance>=0.2.40"]
# CPU speech-to-text fallback for when mlx-whisper is unavailable.
fallback-stt = ["faster-whisper>=1.0"]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.22", "ruff>=0.4"]

[project.scripts]
jarvisd = "jarvis_core.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["jarvis_core"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = [".", "tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP007", "E501", "E743", "B905", "B017"]
