- name: timer_minutes_seconds
  patterns:
    - '^(?:set |start )?(?:a |an )?timer (?:for |of )?(?P<m>\d+) ?(?:minutes?|mins?)(?: and)? (?P<s>\d+) ?(?:seconds?|secs?)$'
  tool: timer_set
