  args: {by: memory}
  reply: "{result}"

- name: open_settings
  patterns:
    - '^(?:open|show|go to|pull up) (?:the |my )?(?P<pane>wi-?fi|network|bluetooth|display|displays|sound|battery|notifications|keyboard|trackpad|mouse|storage|wallpaper|privacy|security|accessibility|control center|login items|software update|date and time)(?: settings| preferences)$'
    - '^(?:open|show|go to|pull up) (?:the |my )?(?:system )?(?:settings|preferences)$'
  tool: open_settings
  args: {pane: "{pane}"}
  reply: "{result}"
  follow_up: false

- name: open_app
  patterns:
    - '^(?:open|launch|start|fire up|bring up|pull up)(?: up)? (?:the |my )?(?P<name>[a-z0-9][a-z0-9 .+\-]{1,38}?)(?: app| application)?$'
  tool: open_app
  args: {name: "{name}"}
  reply: "Opening {name}, sir."

- name: focus_app
  patterns:
    - '^(?:switch|go) to (?:the )?(?P<name>[a-z0-9][a-z0-9 .+\-]{1,38}?)(?: app)?$'
  tool: focus_app
  args: {name: "{name}"}
  reply: "{name} is up, sir."

- name: quit_app
