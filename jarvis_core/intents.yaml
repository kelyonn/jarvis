  reply: "{result}"

- name: weather_in
  patterns:
    - '^(?:what(?:s| is) the )?(?:weather|forecast|temperature) (?:like )?(?:in|for|at) (?P<city>[a-z .\-]{2,40}?)(?: (?P<day>today|tomorrow))?$'
    - '^(?:how(?:s| is) the weather) (?:in|at) (?P<city>[a-z .\-]{2,40}?)(?: (?P<day>today|tomorrow))?$'
  tool: get_weather
  args: {city: "{city}", day: "{day}"}
  reply: "{result}"

- name: remind_me
  patterns:
    - '^remind me (?:to |about |that )?(?P<title>.+?) (?P<when>(?:at|in|on|by|tomorrow|tonight|next|this|every) .+)$'
    - '^remind me (?:to |about )?(?P<title>.+?) (?P<when>tomorrow|tonight)$'
  tool: reminder_create
  args: {title: "{title}", when: "{when}"}
  reply: "{result}"
  follow_up: false

- name: remind_me_in
  patterns:
    - '^remind me (?P<when>in (?:\d+(?:\.\d+)?|a|an|one|two|three|four|five|ten|fifteen|twenty|thirty|forty five|sixty|half an?) (?:seconds?|minutes?|mins?|hours?|hrs?|days?)) (?:to |about |that )(?P<title>.+)$'
  tool: reminder_create
  args: {title: "{title}", when: "{when}"}
  reply: "{result}"
  follow_up: false

- name: remind_me_later
  patterns:
    - '^remind me (?:to |about )(?P<title>.+)$'
  tool: reminder_create
  args: {title: "{title}"}
  reply: "{result}"
  follow_up: false

- name: note_create
  patterns:
    - '^(?:add|make|create|take|write|jot down|save)(?: me)? (?:a |an )?note (?:that |saying |called |titled |to |about )?(?P<title>.+)$'
    - '^(?:note|jot) (?:down )?(?:that )?(?P<title>.+)$'
  tool: note_create
  args: {title: "{title}"}
  reply: "{result}"
  follow_up: false

- name: list_reminders
  patterns:
    - '^(?:list|show|read|check)(?: me)? (?:my |the |all my )?(?:open |pending |upcoming )?reminders$'
    - '^what(?:s| are| is) (?:on )?my (?:open |pending |upcoming )?(?:reminders|to-?do(?: list)?)$'
    - '^what do i have to remember$'
  tool: reminder_list
  args: {}
  reply: "{result}"

- name: read_clipboard
  patterns:
    - '^(?:what(?:s| is) (?:on|in) my clipboard|read (?:my |the )?clipboard|what did i (?:just )?copy)$'
  tool: clipboard_read
  args: {}
  reply: "{result}"

- name: network_info
  patterns:
    - '^(?:what(?:s| is) my (?:ip|ip address|wi-?fi|network)|am i (?:online|connected)(?: to (?:the )?(?:internet|wi-?fi))?|network (?:status|info))$'
  tool: network_info
  args: {}
  reply: "{result}"

- name: top_cpu
  patterns:
    - '^what(?:s| is) (?:eating|using|hogging|taking up|slowing down) (?:my |the )?(?:cpu|processor|mac)$'
    - '^what(?:s| is) using (?:the )?most cpu$'
    - '^top processes$'
  tool: top_processes
  args: {by: cpu}
  reply: "{result}"

- name: top_memory
  patterns:
    - '^what(?:s| is) (?:eating|using|hogging|taking up) (?:my |the )?(?:memory|ram)$'
    - '^what(?:s| is) using (?:the )?most (?:memory|ram)$'
