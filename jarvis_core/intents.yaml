    - '^(?:open|show|go to|pull up) (?:my |the )?(?P<path>music) (?:folder|directory)$'
  tool: open_path
  args: {path: "{path}"}
  reply: "{result}"
  follow_up: false

- name: open_site
  patterns:
    - '^(?:open|go to|launch|pull up|bring up|take me to) (?:the )?(?P<name>youtube|gmail|github|google|twitter|reddit|netflix|linkedin|facebook|instagram|amazon|chatgpt|claude|stack ?overflow|wikipedia|google drive|google maps|google docs|google sheets|google calendar|overleaf|leetcode|hacker news|twitch)(?: website| site| in (?:the |my )?browser| on (?:the )?web)?$'
  tool: open_site
  args: {name: "{name}"}
  reply: "{result}"
  follow_up: false

- name: open_domain
  patterns:
    - '^(?:open|go to|launch|pull up|visit|take me to) (?:the )?(?:website |site )?(?P<url>(?:https?://)?[a-z0-9][a-z0-9-]*(?:\.[a-z0-9-]+)*\.(?:com|org|net|io|dev|ai|in|co|edu|gov|app|me|xyz)(?:/\S*)?)$'
  tool: open_url
  args: {url: "{url}"}
  reply: "{result}"
  follow_up: false

- name: focus_browser_tab
