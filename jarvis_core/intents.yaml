    - '^turn (?:the )?(?:volume|sound) to (?P<level>\d{1,3})(?: ?%| percent)?$'
  tool: set_volume
  args: {level: "{level}"}
  reply: "Volume at {level} percent."

- name: volume_up
  patterns:
    - '^(?:turn (?:it |the volume |the sound )?up|volume up|louder|raise the volume|increase the volume|a bit louder)$'
  tool: change_volume
  args: {direction: up, amount: "15"}
  reply: "Louder, sir."

- name: volume_down
  patterns:
    - '^(?:turn (?:it |the volume |the sound )?down|volume down|quieter|lower the volume|decrease the volume|a bit quieter|softer)$'
  tool: change_volume
  args: {direction: down, amount: "15"}
  reply: "Quieter, sir."

- name: mute
  patterns:
    - '^(?:mute|mute (?:the )?(?:sound|volume|audio|mac)|silence the mac)$'
  tool: mute_volume
  args: {"on": "true"}
  reply: "Muted, sir."

- name: unmute
  patterns:
    - '^(?:unmute|unmute (?:the )?(?:sound|volume|audio|mac))$'
  tool: mute_volume
  args: {"on": "false"}
  reply: "Sound is back, sir."

- name: brightness_up
  patterns:
    - '^(?:brightness up|brighter|(?:turn|raise|increase) (?:the )?(?:screen |display )?brightness up|make (?:it|the screen) brighter)$'
  tool: change_brightness
  args: {direction: up}
  reply: "Brighter, sir."

- name: brightness_down
