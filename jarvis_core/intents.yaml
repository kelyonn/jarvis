    - '^(?:quit|close|exit|kill|shut down) (?:the )?(?P<name>[a-z0-9][a-z0-9 .+\-]{1,38}?)(?: app)?$'
  tool: quit_app
  args: {name: "{name}"}
  reply: "Closing {name}, sir."

- name: volume_set
  patterns:
