    - '^(?:set |start )?(?:a |an )?(?P<n>\d+(?:\.\d+)?|a|an|one|two|three|four|five|ten|fifteen|twenty|thirty|forty five|forty|fifty|sixty)[ -](?:seconds?|secs?)(?: timer)?$'
  tool: timer_set
