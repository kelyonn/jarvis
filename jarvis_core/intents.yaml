- name: timer_hours
  patterns:
    - '^(?:set |start )?(?:a |an )?timer (?:for |of )?(?P<n>\d+(?:\.\d+)?|a|an|one|two|three) ?(?:hours?|hrs?)$'
    - '^(?:set |start )?(?:a |an )?(?P<n>\d+(?:\.\d+)?|a|an|one|two|three)[ -](?:hours?|hrs?)(?: timer)?$'
  tool: timer_set
  scale: 60
  args: {minutes: "{n}"}
  reply: "Timer set, sir."

- name: timer_cancel
  patterns:
    - '^(?:cancel|stop|clear|delete) (?:the |my |all )?(?:timers?|alarms?)$'
  tool: timer_cancel
  args: {}
  reply: "Timer cancelled, sir."

- name: snap_window
  patterns:
    - '^(?:snap|put|move|place|tile) (?:the )?(?P<app>[a-z0-9][a-z0-9 .+\-]{1,30}?) (?:window )?(?:to|on|at|in) (?:the )?(?P<pos>left(?: half| side| third)?|right(?: half| side| third)?|top(?: half| left| right)?|bottom(?: half| left| right)?|center|centre|middle|full ?screen|maximi[sz]e|upper left|upper right|lower left|lower right)$'
    - '^(?:maximi[sz]e) (?:the )?(?P<app>[a-z0-9][a-z0-9 .+\-]{1,30}?)(?: window)?(?P<pos>)$'
  tool: window_snap
  args: {app: "{app}", position: "{pos}"}
  reply: "Done, sir."

