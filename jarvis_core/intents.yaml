- name: timer_minutes
  patterns:
    - '^(?:set |start )?(?:a |an )?timer (?:for |of )?(?P<n>\d+(?:\.\d+)?|a|an|one|two|three|four|five|ten|fifteen|twenty|thirty|forty five|forty|sixty) ?(?:minutes?|mins?)$'
    - '^(?:set |start )?(?:a |an )?(?P<n>\d+(?:\.\d+)?|a|an|one|two|three|four|five|ten|fifteen|twenty|thirty|forty five|forty|sixty)[ -](?:minutes?|mins?)(?: timer)?$'
  tool: timer_set
