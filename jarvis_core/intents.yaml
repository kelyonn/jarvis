# Fast-path intents: matched with plain regexes (no LLM round trip) for short, unambiguous commands.
# Anything that doesn't match fully falls through to the tool-calling agent, so adding a pattern here
# is only ever a latency optimisation. If the tool fails, the agent takes over as well.
#
# Fields: patterns (regex, matched against normalised text), tool, args ({group} templates),
#         reply ({group}, {result}), scale (multiply numeric group "n"), follow_up (default true).

- name: learn_voice
  patterns:
    - '^(?:please )?(?:learn|recogni[sz]e|train|enrol|enroll|remember|set up|setup) (?:my )?voice(?: recognition)?$'
    - '^(?:please )?(?:set up|setup|turn on|start) voice (?:recognition|id|identification)$'
    - '^(?:please )?(?:learn|get to know|teach yourself) (?:who i am|my voice)$'
  tool: learn_my_voice
  args: {}
  reply: "{result}"
  follow_up: true

- name: forget_voice
  patterns:
    - '^(?:please )?(?:forget|delete|reset|remove) my voice(?: print| recognition)?$'
    - '^(?:please )?(?:turn off|stop|disable) voice (?:recognition|id|identification)$'
  tool: forget_my_voice
  args: {}
  reply: "{result}"
  follow_up: false

- name: timer_status
  patterns:
    - '^(?:where are we|how are we|what(?:s| is) the (?:status|state)|how(?:s| is)) (?:with |of |on )?(?:the |my )?(?:timer|timers)(?: now)?$'
    - '^(?:how (?:much )?(?:time|long) (?:is )?(?:left|remaining)(?: on (?:the|my) timer)?|how long (?:until|till) (?:the|my) timer(?: (?:goes off|is up|ends))?|time left)$'
    - '^(?:what timers (?:do i have|are (?:running|set))|any timers(?: running)?|is (?:the|my) timer (?:still )?running)$'
    - '^(?:(?:the|my) )?timers?$'
    - '^(?:how (?:much|long)(?: time)?|what(?:s| is)) (?:is )?(?:left|remaining) (?:in|on|for) (?:the|my|that) .{0,40}?(?:timer|one)$'
    - '^(?:check|show|list) (?:the |my )?timers?$'
  tool: timer_list
  args: {}
  reply: "{result}"

- name: play_playlist
  patterns:
    - '^(?:please )?(?:open (?:spotify|music) (?:and |then )?)?(?:play|put on|start|queue up|queue) (?:the |my |our )?(?P<name>.+?) playlist(?: (?:on spotify|in spotify|from (?:my|the) [a-z0-9 ]*folder|in (?:my|the) [a-z0-9 ]*folder))*$'
    - '^(?:please )?(?:open (?:spotify|music) (?:and |then )?)?(?:play|put on|start) (?:my |the )?playlist (?P<name>.+?)(?: (?:on spotify|from (?:my|the) [a-z0-9 ]*folder|in (?:my|the) [a-z0-9 ]*folder))?$'
    - '^(?:please )?(?:open (?:spotify|music) (?:and |then )?)?(?:play|put on|start) (?:the |my )?(?P<name>.+?) (?:from|in) (?:my|the) (?:[a-z0-9 ]+ )?folder$'
  tool: play_my_playlist
  args: {name: "{name}"}
  reply: "{result}"
  follow_up: false

- name: shuffle_playlist
  patterns:
    - '^(?:please )?(?:open (?:spotify|music) (?:and |then )?)?shuffle (?:the |my |our )?(?P<name>.+?)(?: playlist)?$'
  tool: play_my_playlist
  args: {name: "{name}", shuffle: "true"}
  reply: "{result}"
  follow_up: false

- name: play_liked
  patterns:
    - '^(?:please )?(?:play|put on|start|shuffle) (?:my )?(?:liked|favou?rite|saved) (?:songs|tracks|music)$'
  tool: play_liked_songs
  args: {}
  reply: "{result}"
  follow_up: false

- name: play_music
  patterns:
    - '^(?:please )?(?:open|launch|start) (?:spotify|music|apple music) (?:and |then )?(?:play|put on) (?!.*\b(?:youtube|video|game|netflix|movie)\b)(?P<query>.+)$'
    - '^(?:please )?(?:play|put on|start playing) (?!(?:pause|music|the music|something|anything)$)(?!.*\b(?:youtube|video|game|netflix|movie)\b)(?P<query>.+?)(?: (?:on|in|using|with|via) (?P<app>spotify|apple music|music))?$'
  tool: play_music
  args: {query: "{query}", app: "{app}"}
  reply: "{result}"
  follow_up: false

- name: routine
  patterns:
    - '^(?:start|run|activate|begin|enable|switch to) (?:my |the )?(?P<name>[a-z ]{2,30}?)(?: mode| routine| setup)$'
    - '^(?:work|focus|study|dev|morning|evening|meeting) mode$'
  tool: run_routine
  args: {name: "{name}"}
  reply: "{result}"

- name: alarm_set
  patterns:
    - '^(?:set|make|create|add|start) (?:me )?(?:an? )?(?P<label>[a-z ]{2,20}? )?alarm (?:for|at|to) (?P<time>.+)$'
    - '^(?:set|make|create|add) (?:me )?(?:an? )?alarm$'
    - '^(?:wake me(?: up)?|alarm me) (?:at|for) (?P<time>.+)$'
  tool: alarm_set
  args: {time: "{time}", label: "{label}"}
  reply: "{result}"
  follow_up: false

- name: open_messaging_app
  patterns:
    - '^(?:open|pull up|bring up|go to) (?:a |the |my )?(?:chat|chats|conversations?) (?:on|in) (?P<name>whatsapp|imessage)$'
  tool: open_app
  args: {name: "{name}"}
  reply: "Opening {name}, sir."

- name: open_chat
  patterns:
    - '^(?:open|pull up|show|bring up|go to) (?:my |the )?(?P<app>whatsapp|imessage|messages) (?:chat|conversation|thread|dm) (?:with|for|of) (?P<person>.+)$'
    - '^(?:open|pull up|show|bring up|go to) (?:my |the )?(?:chat|conversation|thread|dm) (?:with|for|of) (?P<person>.+?)(?: (?:on|in) (?P<app>whatsapp|imessage|messages))?$'
    - '^(?:open|pull up|show|bring up|go to) (?P<person>.+?)(?:s)? (?P<app>whatsapp|imessage) (?:chat|conversation|thread)$'
    - '^(?:open|pull up|show|bring up|go to) (?P<person>.+?)(?:s)? (?:chat|conversation|thread|dm)(?: (?:on|in) (?P<app>whatsapp|imessage|messages))?$'
    - '^(?:open|pull up|show|bring up|go to) (?P<person>.+?) (?:on|in) (?P<app>whatsapp|imessage)$'
  tool: open_chat
  args: {person: "{person}", app: "{app}"}
  reply: "{result}"
  follow_up: false

- name: close_tab
  patterns:
    - '^(?:close|kill|shut|get rid of) (?:this|the|current|that|my current) (?:browser |chrome |safari )?tab$'
  tool: close_tab
