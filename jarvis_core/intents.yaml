  tool: change_brightness
  args: {direction: down}
  reply: "Dimmer, sir."

- name: brightness_set
  patterns:
    - '^(?:set )?(?:the )?(?:screen |display )?brightness (?:to |at )?(?P<level>\d{1,3})(?: ?%| percent)?$'
  tool: set_brightness
  args: {level: "{level}"}
  reply: "Brightness at {level} percent."

- name: media_pause
