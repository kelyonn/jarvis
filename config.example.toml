# Copy to ~/.jarvis/config.toml (jarvisd setup does this for you). Secrets go in the Keychain.

[user]
name = "sir"                     # form of address
timezone = "Asia/Kolkata"
day_start_hour = 9                # your day runs 09:00 to 03:00
day_end_hour = 3
quiet_hours = ["03:00", "09:00"] # no spoken alerts (queued instead)

[activation]
# "wake_word": say "Hey Jarvis" any time, even mid-reply (mic stays open). "hotkey": mic closed until you press the hotkey.
listen_mode = "wake_word"
wake_interrupt = true   # "Hey Jarvis" interrupts it while it is speaking
wake_word = "hey_jarvis"
wake_threshold = 0.6
hotkey = "option+space"
follow_up_seconds = 8
conversation_follow_up_seconds = 14   # between replies once you are properly talking
barge_in = true

[voice]
stt = "mlx-whisper"              # or "faster-whisper"
stt_model = "mlx-community/whisper-large-v3-turbo"
tts = "kokoro"                   # "kokoro" (local), "edge" (online, more natural) or "say"
tts_voice = "bm_george,bm_fable" # commas blend voices; alt: "bm_lewis"
tts_speed = 1.0
humanize = true                  # clause pacing, pauses, speed variation
edge_voice = "en-GB-RyanNeural"  # only used when tts = "edge"

[llm]
provider = "nim"
chat_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"   # tested live: chat, tools and vision all work
fast_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
vision_model = "nvidia/nemotron-3-nano-omni-30b-a3b-reasoning"
fallback_models = ["nvidia/nemotron-3.5-super-vl-120b-a12b", "nvidia/nemotron-3.5-lightning-30b-a3b"]   # tried if the above is gone
temperature = 0.6
max_tool_iterations = 6
request_timeout_s = 20

[briefing]
day_rollover_hour = 3            # waking after this hour starts a new day: first lid-open gets the full brief
first_open_full_brief = true
slots = ["13:00", "19:00"]       # REPLACE with your custom times
deliver_missed_slots_on_wake = true
target_minutes = 0.6             # a normal full brief, spoken
max_minutes = 1.0                # hard ceiling
urgent_max_minutes = 1.4         # only when something urgent deserves it
include_linkedin = false
sections = ["greeting","weather","calendar","email","messages","markets","news_tech","reminders"]

[markets]
indices = ["^NSEI","^BSESN","^GSPC","^IXIC"]
crypto = ["BTC-USD","ETH-USD"]
watchlist = []

[news]
world = ["https://feeds.bbci.co.uk/news/world/rss.xml", "https://feeds.reuters.com/reuters/worldNews"]
india = ["https://www.thehindu.com/news/national/feeder/default.rss", "https://indianexpress.com/section/india/feed/"]
tech  = ["https://hnrss.org/frontpage?points=200", "https://www.theverge.com/rss/index.xml", "https://techcrunch.com/category/artificial-intelligence/feed/"]
items_per_section = 3

[alerts]
poll_seconds = 120
meeting_lead_minutes = 10
market_index_move_pct = 1.5
crypto_move_pct = 5.0
rain_lookahead_hours = 2
rain_probability_pct = 60
battery_low_pct = 15
breaking_news_min_sources = 3
cooldown_minutes = { market = 60, rain = 180, news = 30, battery = 30 }

[messaging]
apps = ["whatsapp","imessage","gmail","linkedin"]
proactive_reply_offers = true
offer_for = "vip_and_important"  # or "vip_only"

[vip]
contacts = []                    # e.g. ["Mom", "Rahul Sharma"]

[devices]
airpods = ""                     # name as shown in Bluetooth settings

[routines.work]
apps = ["Visual Studio Code","Google Chrome","Slack","Spotify"]
layout = { "Visual Studio Code" = "left-2/3", "Google Chrome" = "right-1/3" }
focus = "Work"

[routines.chill]
apps = ["Spotify","Safari"]

[safety]
confirm_risky = true
never_click_labels = ["send","post","submit","buy","pay","purchase","delete","remove","confirm order"]
terminal_allowlist_no_confirm = ["ls","pwd","df -h","uptime"]
transcript_retention_days = 7

[memory]
enabled = true
auto_extract = true              # quietly remember lasting facts you state (your words only)
max_facts = 2000
